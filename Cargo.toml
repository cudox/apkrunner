[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
apkrunner-apk = { path = "crates/apkrunner-apk" }
apkrunner-core = { path = "crates/apkrunner-core" }

[profile.release]
lto = "thin"
strip = true
